openapi: 3.1.0
info:
  title: Coinicap Markets API
  version: 1.0.0
  description: OHLCV samples and derived aggregates. `market` is the canonical output symbol; `exchange_symbol` is venue-native. Prices are decimal strings; Persian/English metadata is returned together. Responses are cached up to five minutes.
servers:
  - url: https://{worker-host}
    variables:
      worker-host:
        default: coinicap-markets.example.workers.dev
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Worker is responding
  /api/v1/exchanges:
    get:
      summary: List enabled exchanges
      responses:
        '200':
          description: Enabled exchange list
  /api/v1/assets:
    get:
      summary: List enabled assets
      responses:
        '200':
          description: Coins/currencies with type and Persian/English names
  /api/v1/markets:
    get:
      summary: List enabled canonical markets
      responses:
        '200':
          description: Enabled markets
  /api/v1/exchange-markets:
    get:
      summary: List venue pair mappings and safe request configuration
      parameters:
        - in: query
          name: exchange
          schema: { type: string }
        - in: query
          name: market
          schema: { type: string }
      responses:
        '200':
          description: Native symbol, endpoint template, field mapping and timeframe interval
  /api/v1/timeframes:
    get:
      summary: List enabled output timeframes
      parameters:
        - in: query
          name: exchange
          schema: { type: string }
        - in: query
          name: market
          schema: { type: string }
      responses:
        '200':
          description: Timeframes configured for active exchange-market mappings
  /api/v1/quotes/latest:
    get:
      summary: Get last known good quotes
      parameters:
        - in: query
          name: exchange
          schema: { type: string }
        - in: query
          name: market
          schema: { type: string }
        - in: query
          name: timeframe
          description: Normalized timeframe such as 5m, 15m, or 1h
          schema: { type: string }
      responses:
        '200':
          description: Latest quotes with timestamps and age
  /api/v1/quotes/series:
    get:
      summary: Get a bounded quote history
      parameters:
        - in: query
          name: exchange
          required: true
          schema: { type: string }
        - in: query
          name: market
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          required: true
          schema: { type: string }
        - in: query
          name: from
          required: true
          description: Inclusive Unix timestamp in milliseconds
          schema: { type: integer }
        - in: query
          name: to
          required: true
          description: Inclusive Unix timestamp in milliseconds; maximum range is 90 days
          schema: { type: integer }
      responses:
        '200':
          description: Historical observations
        '400':
          description: Invalid parameters
  /api/v1/aggregates/latest:
    get:
      summary: Get latest cross-exchange aggregates
      parameters:
        - in: query
          name: market
          schema: { type: string }
        - in: query
          name: timeframe
          schema: { type: string }
        - in: query
          name: type
          description: Filter to cex or otc; omit to return all scopes
          schema: { type: string, enum: [cex, otc] }
      responses:
        '200':
          description: Means, cross-exchange high/low, volume/value sums, and contributor counts
  /api/v1/aggregates/series:
    get:
      summary: Get stored cross-exchange aggregate history
      parameters:
        - in: query
          name: market
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [cex, otc, hybrid] }
        - in: query
          name: from
          required: true
          description: Inclusive Unix timestamp in milliseconds; range up to 90 days
          schema: { type: integer }
        - in: query
          name: to
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Stored all/type aggregate rows
        '400':
          description: Invalid parameters or date range
  /api/v1/indices:
    get:
      summary: List enabled configurable price indices
      responses:
        '200':
          description: Index definitions and component pair mappings
  /api/v1/indices/{code}:
    get:
      summary: Get one calculated index and direct-market comparison
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          schema: { type: string, default: 5m }
        - in: query
          name: type
          schema: { type: string, enum: [cex, otc, hybrid] }
        - in: query
          name: exchange
          schema: { type: string }
      responses:
        '200':
          description: Index, direct quote, gap percentage and quality flags
  /api/v1/indices/{code}/components:
    get:
      summary: Get per-exchange component rates for one index
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          schema: { type: string, default: 5m }
        - in: query
          name: type
          schema: { type: string, enum: [cex, otc, hybrid] }
        - in: query
          name: exchange
          schema: { type: string }
      responses:
        '200':
          description: Component implied rates and source timestamps
  /api/v1/indices/{code}/exchanges:
    get:
      summary: Get one index for each exchange
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          schema: { type: string, default: 5m }
      responses:
        '200':
          description: Per-exchange index prices with CEX/OTC classification
  /api/v1/indices/{code}/series:
    get:
      summary: Get stored calculated index history and direct-market gap
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: timeframe
          schema: { type: string, default: 5m }
        - in: query
          name: type
          schema: { type: string, enum: [cex, otc, hybrid] }
        - in: query
          name: exchange
          schema: { type: string }
        - in: query
          name: from
          required: true
          description: Inclusive Unix timestamp in milliseconds; range up to 90 days
          schema: { type: integer }
        - in: query
          name: to
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Index samples, direct market comparison, and percentage gap
        '400':
          description: Invalid parameters or date range
  /api/v1/estimates/usdt-tmn:
    get:
      summary: Direct and implied USDT/TMN index
      parameters:
        - in: query
          name: timeframe
          schema: { type: string, default: 5m }
        - in: query
          name: type
          schema: { type: string, enum: [cex, otc] }
        - in: query
          name: exchange
          description: Return one exchange's implied index
          schema: { type: string }
      responses:
        '200':
          description: Derived index, direct USDTTMN aggregate, contributing assets and freshness
  /api/v1/estimates/usdt-tmn/components:
    get:
      summary: Get per-exchange and per-asset implied USDT/TMN rates
      parameters:
        - in: query
          name: timeframe
          schema: { type: string, default: 5m }
        - in: query
          name: type
          schema: { type: string, enum: [cex, otc] }
        - in: query
          name: exchange
          schema: { type: string }
      responses:
        '200':
          description: Implied rates and both source sample timestamps
  /api/v1/estimates/usdt-tmn/exchanges:
    get:
      summary: Get the latest implied index for each exchange
      parameters:
        - in: query
          name: timeframe
          schema: { type: string, default: 5m }
      responses:
        '200':
          description: Per-exchange indices with CEX/OTC classification
