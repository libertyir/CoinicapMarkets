<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="نمای بازارهای صرافی‌های رمزارز ایرانی">
    <title>Coinicap Markets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="./styles.css" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-4 py-lg-5">
      <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
          <h1 class="h3 mb-1">بازارها</h1>
          <p class="text-secondary mb-0">قیمت‌های تجمیعی از صرافی‌های ایرانی</p>
        </div>
        <span id="connection-state" class="badge text-bg-secondary">در حال اتصال</span>
      </header>
      <section class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3"><strong>آخرین قیمت‌ها</strong><span id="updated-at" class="small text-secondary me-3"></span></div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead><tr><th>صرافی</th><th>بازار</th><th>قیمت</th><th>آخرین دریافت</th><th>وضعیت</th></tr></thead>
            <tbody id="quotes"><tr><td colspan="5" class="text-center text-secondary py-5">دریافت اطلاعات…</td></tr></tbody>
          </table>
        </div>
      </section>
      <p id="message" class="small text-secondary mt-3">API مستقل است؛ نشانی آن در فایل <code>config.js</code> تنظیم می‌شود.</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./config.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
